name: Publish documentation

on:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install .
      - run: dockit-fp check
      - run: dockit-fp check-release
      - run: dockit-fp build-all --output build/docs-site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/docs-site
      - id: deployment
        uses: actions/deploy-pages@v4
